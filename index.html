<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento de Projetos Interinstitucionais | DIST - DSV</title>
  
  <!-- Favicon Oficial Detran.SP -->
  <link rel="icon" type="image/png" href="/favicon.png">
  
  <!-- Fontes do Google: Open Sans (300, 400, 500, 600, 700, 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- Material Icons & Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- Estilos principais -->
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/sidebar.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/matrix.css">
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Sidebar será montada aqui -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <!-- Área de Conteúdo Principal -->
    <div class="main-wrapper">
      <!-- Header Superior com Contexto de Projeto e Perfil -->
      <header id="header-container" class="top-header"></header>

      <!-- Conteúdo da View Ativa -->
      <main id="main-content" class="main-content" role="main" tabindex="-1">
        <div class="wrap" id="view-container">
          <!-- Views são renderizadas aqui dinamicamente -->
        </div>
      </main>
    </div>
  </div>

  <!-- Container de Toasts/Notificações -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal Global Container -->
  <div id="modal-container" class="modal-container" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <!-- Script Principal da SPA -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
